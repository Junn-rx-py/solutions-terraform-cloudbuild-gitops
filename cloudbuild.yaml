steps:
  - id: 'terraform init' # Added an ID for clarity
    name: 'hashicorp/terraform:1.2.0' # Or desired Terraform version
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        # Change directory to where your Terraform files are located
        cd environments/dev
        terraform init -backend-config="bucket=tf-state-tipo168" \
                        -backend-config="prefix=terraform/state"

  - id: 'terraform plan' # Added an ID for clarity
    name: 'hashicorp/terraform:1.2.0' # Or desired Terraform version
    entrypoint: 'sh' # Added entrypoint for running shell commands
    args: ['-c', 'cd environments/dev && terraform plan -out=tfplan'] # Navigate and plan

  - id: 'terraform apply' # Added an ID for clarity
    name: 'hashicorp/terraform:1.2.0' # Or desired Terraform version
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        # Change directory and apply the plan
        cd environments/dev
        # In a real production setup, you'd typically have a manual approval step here
        # or separate triggers for plan and apply. For this exercise, we auto-apply.
        terraform apply -auto-approve tfplan
    secretEnv: ['TF_VAR_db_password'] # This variable needs to be passed securely

options:
  logging: CLOUD_LOGGING_ONLY

# Substitutions (optional, but often useful for dynamic values)
# For example, to make it easy to run against different branches/environments
# Note: _TF_ROOT is defined but not explicitly used here. If you want to use it
# you would replace 'environments/dev' with '${_TF_ROOT}' in the cd commands.
# For simplicity, directly using 'environments/dev' is fine for now.
substitutions:
  _TF_ROOT: 'environments/dev' # Points to where your main.tf is

availableSecrets:
  secretManager:
    - versionName: projects/tipo168/secrets/app-db-credentials/versions/latest
      env: 'TF_VAR_db_password'
